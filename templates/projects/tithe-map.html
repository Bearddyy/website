<!DOCTYPE html>
<html lang="en">

<head>
    <link href={{ font_path }} rel="stylesheet" />
    <link href="{{ url_for('static',filename='styles/main.css') }}?v={{ css_version }}" rel="stylesheet" />
    <title>NULL PTR</title>
</head>

<body>

    <span class="logo"><a href="/">NULL PTR</a></span>
    {% include "_nav.html" %}

    <!-- Pointer to the source repo for the map viewer and its data. -->

        <a href="https://github.com/Bearddyy/SALH_Map" target="_blank"
            rel="noopener">## SALH_MAP on github</a>

        <iframe src="/projects/tithe-map/app" title="Stanstead Abbots Tithe Map 1840"></iframe>
    </div>

    <p class="bottomText">bottom text</p>

</body>
